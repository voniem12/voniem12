<svg fill="none" viewBox="0 0 846 150" width="846" height="150" xmlns="http://www.w3.org/2000/svg">
	<foreignObject width="100%" height="100%">
		<div xmlns="http://www.w3.org/1999/xhtml">
			<style>
				.container {
					font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
					display: flex;
					flex-direction: column;
					align-items: center;
					justify-content: center;
					margin: 0;
					width: 100%;
					height: 150px;
          background-color: #20232A;
					border-radius: 10px;
					color: white;
          line-height: 1.6;
				}
        .quotes-eng {
          font-size: 18px;
          font-style: italic;
          text-align: center;
          max-width: 760px;
          margin: 0 16px;
          line-height: 1.8;
          position: relative;
        }
        .quotes-eng::before {
          content: "“";
          color: #9da3af;
          margin-right: 4px;
        }
        .quotes-eng::after {
          content: "”";
          color: #9da3af;
          margin-left: 4px;
        }
        .quotes-vi {
          font-size: 18px;
        }
        .trungquandev-signature {
          font-size: 14px;
          margin-top: 6px;
          opacity: 0.85;
          letter-spacing: 0.3px;
        }
			</style>

			<div class="container">
        <div class="quotes-eng">Kiếp sau, tin thì có, không tin thì không, năm tháng dằng dặc, thế gian cuối cùng sẽ xuất hiện hai đóa hoa giống nhau, trăm ngàn năm nhìn lại, một hoa tàn lụi, một hoa nở. Phải chăng là cùng một đóa, mặc cho hậu nhân đi bình luận.</div>

        <div class="trungquandev-signature">— Ẩn danh —</div>
      </div>
		</div>
	</foreignObject>
</svg>
